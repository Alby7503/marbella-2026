name = "marbella-bot"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Senza questo, la scheda Logs/Observability della dashboard resta vuota
# anche se le richieste arrivano regolarmente — un Worker creato da riga di
# comando (come questo) non ce l'ha attivo di default, a differenza di uno
# creato dalla dashboard.
[observability]
enabled = true

# Variabili non segrete. I segreti (TELEGRAM_BOT_TOKEN, GEMINI_API_KEY,
# WEBHOOK_SECRET) NON vanno qui: si impostano come secret del Worker.
[vars]
BOT_USERNAME = "schiavomarbellabot"
PLAN_URL = "https://raw.githubusercontent.com/alby7503/marbella-2026/main/index.html"
GEMINI_MODEL = "gemini-3.5-flash"

# ID del gruppo Telegram autorizzato. Vuoto = chiunque trovi il bot può usarlo.
# Scrivi /chatid nel gruppo per farti dire l'ID, poi incollalo qui.
ALLOWED_CHAT_IDS = "-1003985301142"
