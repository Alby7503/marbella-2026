name: Crea namespace KV per la memoria del bot

# Workflow usa e getta: crea il namespace CHAT_HISTORY su Cloudflare e ne
# stampa l'id nei log. Va lanciato a mano da Actions -> Run workflow, poi
# rimosso: non serve più dopo l'uso, wrangler.toml tiene l'id in chiaro.
on:
  workflow_dispatch:

jobs:
  create-kv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Crea il namespace CHAT_HISTORY
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler kv namespace create CHAT_HISTORY
